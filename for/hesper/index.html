<style>
  /* the film's own ground (Hesper's #14130F), so the frame's edges disappear */
  html, body { margin: 0; height: 100%; background: #14130f; overflow: hidden; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #14130f; }
</style>
</head>
<body>
<video src="film.mp4" autoplay muted loop playsinline preload="auto"></video>
<script>
  // where autoplay is blocked (iOS Low Power Mode), fall back to the browser's own play control
  const v = document.querySelector('video');
  v.play().catch(() => { v.controls = true; });
</script>
</body>
